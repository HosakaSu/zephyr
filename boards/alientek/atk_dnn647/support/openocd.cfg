source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000

source [find target/swj-dp.tcl]
swj_newdap stm32n6 cpu -irlen 4 -expected-id 0x6ba02477
dap create stm32n6.dap -chain-position stm32n6.cpu
set _TARGETNAME stm32n6.cpu
target create $_TARGETNAME cortex_m -dap stm32n6.dap -ap-num 1

# Use the SRAM header area below the application for checksum verification.
$_TARGETNAME configure -work-area-phys 0x34180000 -work-area-size 0x400 -work-area-backup 1

reset_config srst_nogate
$_TARGETNAME cortex_m reset_config sysresetreq
