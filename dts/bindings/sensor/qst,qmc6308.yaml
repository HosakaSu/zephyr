description: QST QMC6308 three-axis magnetic field sensor

compatible: "qst,qmc6308"

include: [sensor-device.yaml, i2c-device.yaml]

properties:
  full-scale:
    type: int
    default: 30
    enum: [30, 12, 8, 2]
    description: |
      Full-scale magnetic field in gauss. The default matches the reset
      range and gives the widest measurement span.

  sampling-frequency:
    type: int
    default: 10
    enum: [10, 50, 100, 200]
    description: |
      Output data rate in Hz in normal measurement mode. The default
      matches the reset value of the output data rate field.
